<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Заправки Тюмени{% endblock %}</title>
<style>
  :root { --ink: #1d2530; --muted: #5d6b7a; --line: #d9e0e7; --blue: #1f4e79; --bg: #f5f7f9; --red: #b42318; --green: #1e7a46; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  a { color: var(--blue); }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  nav { background: var(--blue); color: #fff; padding: 20px 0; }
  nav .brand { font-weight: 700; font-size: 17px; padding: 0 20px 16px; display: block; color: #fff; text-decoration: none; }
  nav .brand small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
  nav a.item { display: block; padding: 8px 20px; color: #dbe7f3; text-decoration: none; }
  nav a.item:hover, nav a.item.active { background: rgba(255,255,255,.12); color: #fff; }
  main { padding: 28px 36px; max-width: 1200px; }
  h1 { margin: 0 0 18px; font-size: 24px; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--blue); background: var(--blue); color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
  .btn.light { background: #fff; color: var(--blue); }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .btn.danger { background: #fff; color: var(--red); border-color: #e6b4ae; }
  table.data { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
  table.data th { background: var(--blue); color: #fff; text-align: left; font-weight: 600; padding: 8px 10px; font-size: 13px; }
  table.data td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  table.data tr:hover td { background: #f0f5fa; }
  td.actions { white-space: nowrap; }
  td.actions form { display: inline; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
  .msg.ok { background: #e6f4ec; color: var(--green); border: 1px solid #b8dfc8; }
  .msg.error { background: #fdecea; color: var(--red); border: 1px solid #f3c1bb; }
  form.edit { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; max-width: 640px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time],
  .field input[type=datetime-local], .field input[type=password], .field select {
    width: 100%; padding: 7px 9px; border: 1px solid #b9c4cf; border-radius: 6px; font: inherit; background: #fff; }
  .field.check label { display: inline; font-weight: 600; }
  .req { color: var(--red); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; text-decoration: none; color: var(--ink); }
  .tile:hover { border-color: var(--blue); }
  .tile b { display: block; font-size: 26px; color: var(--blue); }
  .muted { color: var(--muted); }
  .status-есть { color: var(--green); font-weight: 600; }
  .status-нет { color: var(--red); font-weight: 600; }
  .status-нет-данных { color: var(--muted); }
  dl.card { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; margin: 0 0 20px; }
  dl.card dt { font-weight: 600; } dl.card dd { margin: 0; }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <a class="brand" href="{{ url_for('index') }}">Заправки Тюмени<small>база azs</small></a>
    {% for name, t in tables.items() %}
      <a class="item {% if table == name %}active{% endif %}" href="{{ url_for('list_rows', table=name) }}">{{ t.title }}</a>
    {% endfor %}
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, text in messages %}
        <div class="msg {{ 'error' if category == 'error' else 'ok' }}">{{ text }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
